# Continuous integration for fusion-fault-lab-v1.
#   tests:      every push and pull request, Linux + Windows, Python 3.11 + 3.12
#   c-target:   the C code (from M7): gcc with sanitizers, clang, and MSYS2 gcc on Windows;
#               on Linux also the system test (M11): cluster_core + display_term on the bus
#   benchmark:  after the tests pass on main, or by hand (Actions tab -> CI -> Run workflow);
#               redraws the plots, runs the benchmark, uploads them as a downloadable artifact
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds for the benchmark"
        default: "10"

# a newer push to the same branch cancels the older, still-running workflow
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false            # let every combination finish, so one failure shows the whole picture
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test the command-line runner
        run: |
          python -m fusionlab.run --scenario gnss_jump
          python -m fusionlab.run --scenario gyro_bias_step --no-recovery

  c-target:
    name: C target (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux gcc, sanitizers", os: ubuntu-latest, cc: gcc, sanitize: "ON" }
          - { name: "Linux clang", os: ubuntu-latest, cc: clang, sanitize: "OFF" }
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S target -B target/build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DSANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build target/build -j
      - name: Unit tests
        run: ./target/build/unit_tests
      - name: Demos
        run: |
          ./target/build/e2e_demo
          ./target/build/cluster_sim
      - name: C still prints the committed reference frames (M8)
        run: ./target/build/can_vectors | diff - tests/can_vectors.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System test (M11) - the C processes on the bus, driven by Python
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_system.py tests/test_can_contract.py

  c-target-windows:
    name: C target (Windows, MSYS2 gcc)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja diffutils
      - run: cmake -S target -B target/build -G Ninja
      - run: cmake --build target/build
      - run: ./target/build/unit_tests.exe
      - run: ./target/build/can_vectors.exe | diff --strip-trailing-cr - tests/can_vectors.txt

  benchmark:
    name: plots and benchmark
    needs: tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Draw the module plots
        run: |
          for s in scripts/plot_m*.py; do
            echo "::group::$s"
            python "$s"
            echo "::endgroup::"
          done
      - name: Run the benchmark
        run: python -m fusionlab.benchmark --seeds ${{ github.event.inputs.seeds || '10' }}
      - name: Show the results on the run page
        run: cat docs/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload plots and results
        uses: actions/upload-artifact@v6
        with:
          name: plots-and-benchmark
          path: |
            docs/*.png
            docs/results.md
            docs/results.json
          retention-days: 30
