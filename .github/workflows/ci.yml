# Continuous integration for fusion-fault-lab-v1.
#   tests:      every push and pull request, Linux + Windows, Python 3.11 + 3.12
#   benchmark:  after the tests pass on main, or by hand (Actions tab -> CI -> Run workflow);
#               redraws the plots, runs the benchmark, uploads them as a downloadable artifact
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds for the benchmark"
        default: "10"

# a newer push to the same branch cancels the older, still-running workflow
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false            # let every combination finish, so one failure shows the whole picture
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test the command-line runner
        run: |
          python -m fusionlab.run --scenario gnss_jump
          python -m fusionlab.run --scenario gyro_bias_step --no-recovery

  benchmark:
    name: plots and benchmark
    needs: tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Draw the module plots
        run: |
          for s in scripts/plot_m*.py; do
            echo "::group::$s"
            python "$s"
            echo "::endgroup::"
          done
      - name: Run the benchmark
        run: python -m fusionlab.benchmark --seeds ${{ github.event.inputs.seeds || '10' }}
      - name: Show the results on the run page
        run: cat docs/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload plots and results
        uses: actions/upload-artifact@v4
        with:
          name: plots-and-benchmark
          path: |
            docs/*.png
            docs/results.md
            docs/results.json
          retention-days: 30
